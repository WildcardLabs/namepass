# Generated by goldsky/generate-testnet.mjs. Do not edit.
name: namepass-testnet-v2
apiVersion: 3
resource_size: s
description: Detect Namepass testnet deposits and protocol events.

sources:
  ethereum_sepolia_usdc_v2:
    type: dataset
    dataset_name: ethereum_sepolia.erc20_transfers
    version: 1.2.0
    start_at: latest
    filter: >-
      address = '0x1c7d4b196cb0c7b01d743fbc6116a902379c7238'

  ethereum_sepolia_logs_v2:
    type: dataset
    dataset_name: ethereum_sepolia.raw_logs
    version: 1.0.0
    # Contract-address filters make replay bounded by deployment history. Replaying
    # prevents a pipeline recreation from permanently losing earlier renewals.
    start_at: earliest
    filter: >-
      address IN (
        '0x2dcb5ca6b21372b43e37c35da8d5d15160423150',
        '0x39351c9f9eab6093efb4e865a6330ecd2a756f0f'
      ) AND block_number >= 11754050

  base_sepolia_usdc_v2:
    type: dataset
    dataset_name: base_sepolia.erc20_transfers
    version: 1.2.0
    start_at: latest
    filter: >-
      address = '0x036cbd53842c5426634e7929541ec2318f3dcf7e'

  base_sepolia_logs_v2:
    type: dataset
    dataset_name: base_sepolia.raw_logs
    version: 1.0.0
    # Contract-address filters make replay bounded by deployment history. Replaying
    # prevents a pipeline recreation from permanently losing earlier renewals.
    start_at: earliest
    filter: >-
      address IN (
        '0x2dcb5ca6b21372b43e37c35da8d5d15160423150'
      ) AND block_number >= 47132212

  arbitrum_sepolia_usdc_v2:
    type: dataset
    dataset_name: arbitrum_sepolia.erc20_transfers
    version: 1.2.0
    start_at: latest
    filter: >-
      address = '0x75faf114eafb1bdbe2f0316df893fd58ce46aa4d'

  arbitrum_sepolia_logs_v2:
    type: dataset
    dataset_name: arbitrum_sepolia.raw_logs
    version: 1.0.0
    # Contract-address filters make replay bounded by deployment history. Replaying
    # prevents a pipeline recreation from permanently losing earlier renewals.
    start_at: earliest
    filter: >-
      address IN (
        '0x2dcb5ca6b21372b43e37c35da8d5d15160423150'
      ) AND block_number >= 311365500

  arc_testnet_usdc_v2:
    type: dataset
    dataset_name: arc_testnet.erc20_transfers
    version: 1.1.0
    start_at: latest
    filter: >-
      address = '0x3600000000000000000000000000000000000000'

  arc_testnet_native_usdc_v2:
    type: dataset
    dataset_name: arc_testnet.receipt_transactions
    version: 1.0.0
    start_at: latest
    filter: >-
      receipt_status = 1
      AND to_address IS NOT NULL

  arc_testnet_logs_v2:
    type: dataset
    dataset_name: arc_testnet.raw_logs
    version: 1.1.0
    # Contract-address filters make replay bounded by deployment history. Replaying
    # prevents a pipeline recreation from permanently losing earlier renewals.
    start_at: earliest
    filter: >-
      address IN (
        '0x2dcb5ca6b21372b43e37c35da8d5d15160423150'
      ) AND block_number >= 63326249

transforms:
  watched_addresses:
    type: dynamic_table
    backend_type: Postgres
    backend_entity_name: watched_addresses
    schema: goldsky
    column: value
    time_column: updated_at
    secret_name: NAMEPASS_GOLDSKY_READER

  all_usdc_transfers:
    type: sql
    primary_key: event_id
    sql: |
      SELECT
        concat('11155111:', id) AS event_id,
        'deposit' AS event_family,
        'Transfer' AS event_type,
        11155111 AS chain_id,
        block_number,
        block_timestamp AS block_time,
        transaction_hash AS tx_hash,
        log_index,
        lower(address) AS token_address,
        lower(sender) AS sender_address,
        lower(recipient) AS recipient_address,
        CAST(amount AS STRING) AS amount,
        _gs_op
      FROM ethereum_sepolia_usdc_v2
      UNION ALL
      SELECT
        concat('84532:', id) AS event_id,
        'deposit' AS event_family,
        'Transfer' AS event_type,
        84532 AS chain_id,
        block_number,
        block_timestamp AS block_time,
        transaction_hash AS tx_hash,
        log_index,
        lower(address) AS token_address,
        lower(sender) AS sender_address,
        lower(recipient) AS recipient_address,
        CAST(amount AS STRING) AS amount,
        _gs_op
      FROM base_sepolia_usdc_v2
      UNION ALL
      SELECT
        concat('421614:', id) AS event_id,
        'deposit' AS event_family,
        'Transfer' AS event_type,
        421614 AS chain_id,
        block_number,
        block_timestamp AS block_time,
        transaction_hash AS tx_hash,
        log_index,
        lower(address) AS token_address,
        lower(sender) AS sender_address,
        lower(recipient) AS recipient_address,
        CAST(amount AS STRING) AS amount,
        _gs_op
      FROM arbitrum_sepolia_usdc_v2
      UNION ALL
      SELECT
        concat('5042002:', id) AS event_id,
        'deposit' AS event_family,
        'Transfer' AS event_type,
        5042002 AS chain_id,
        block_number,
        block_timestamp AS block_time,
        transaction_hash AS tx_hash,
        log_index,
        lower(address) AS token_address,
        lower(sender) AS sender_address,
        lower(recipient) AS recipient_address,
        CAST(amount AS STRING) AS amount,
        _gs_op
      FROM arc_testnet_usdc_v2
      UNION ALL
      SELECT
        concat('5042002:native:', id) AS event_id,
        'deposit' AS event_family,
        'Transfer' AS event_type,
        5042002 AS chain_id,
        block_number,
        block_timestamp AS block_time,
        hash AS tx_hash,
        transaction_index AS log_index,
        '0x3600000000000000000000000000000000000000' AS token_address,
        lower(from_address) AS sender_address,
        lower(to_address) AS recipient_address,
        u256_to_string(to_u256(value) / to_u256('1000000000000')) AS amount,
        _gs_op
      FROM arc_testnet_native_usdc_v2
      WHERE to_u256(value) >= to_u256('1000000000000')
        AND to_u256(value) % to_u256('1000000000000') = to_u256('0')

  incoming_deposits:
    type: sql
    primary_key: event_id
    sql: |
      SELECT *
      FROM all_usdc_transfers
      WHERE dynamic_table_check('watched_addresses', recipient_address)

  all_raw_logs:
    type: sql
    primary_key: event_id
    sql: |
      SELECT
        concat('11155111:', id) AS event_id,
        11155111 AS chain_id,
        block_number,
        block_timestamp AS block_time,
        transaction_hash AS tx_hash,
        log_index,
        lower(address) AS contract_address,
        topics,
        `data`,
        _gs_op
      FROM ethereum_sepolia_logs_v2
      UNION ALL
      SELECT
        concat('84532:', id) AS event_id,
        84532 AS chain_id,
        block_number,
        block_timestamp AS block_time,
        transaction_hash AS tx_hash,
        log_index,
        lower(address) AS contract_address,
        topics,
        `data`,
        _gs_op
      FROM base_sepolia_logs_v2
      UNION ALL
      SELECT
        concat('421614:', id) AS event_id,
        421614 AS chain_id,
        block_number,
        block_timestamp AS block_time,
        transaction_hash AS tx_hash,
        log_index,
        lower(address) AS contract_address,
        topics,
        `data`,
        _gs_op
      FROM arbitrum_sepolia_logs_v2
      UNION ALL
      SELECT
        concat('5042002:', id) AS event_id,
        5042002 AS chain_id,
        block_number,
        block_timestamp AS block_time,
        transaction_hash AS tx_hash,
        log_index,
        lower(address) AS contract_address,
        topics,
        `data`,
        _gs_op
      FROM arc_testnet_logs_v2

  decoded_logs_v2:
    type: sql
    primary_key: event_id
    sql: |
      SELECT
        event_id,
        chain_id,
        block_number,
        block_time,
        tx_hash,
        log_index,
        contract_address,
        _gs_log_decode(
          '[{"anonymous":false,"inputs":[{"indexed":true,"name":"labelKey","type":"bytes32"},{"indexed":true,"name":"wallet","type":"address"},{"indexed":false,"name":"label","type":"string"}],"name":"WalletDeployed","type":"event"},{"anonymous":false,"inputs":[{"indexed":true,"name":"labelKey","type":"bytes32"},{"indexed":true,"name":"wallet","type":"address"},{"indexed":false,"name":"amount","type":"uint256"},{"indexed":false,"name":"remaining","type":"uint256"}],"name":"DepositProcessed","type":"event"},{"anonymous":false,"inputs":[{"indexed":true,"name":"nonce","type":"bytes32"},{"indexed":true,"name":"wallet","type":"address"},{"indexed":false,"name":"sourceDomain","type":"uint32"},{"indexed":false,"name":"burnAmount","type":"uint256"},{"indexed":false,"name":"feeExecuted","type":"uint256"},{"indexed":false,"name":"mintedAmount","type":"uint256"}],"name":"CCTPClaimed","type":"event"},{"anonymous":false,"inputs":[{"indexed":true,"name":"labelHash","type":"bytes32"},{"indexed":true,"name":"wallet","type":"address"},{"indexed":true,"name":"executor","type":"address"},{"indexed":false,"name":"label","type":"string"},{"indexed":false,"name":"duration","type":"uint64"},{"indexed":false,"name":"amountReceived","type":"uint256"},{"indexed":false,"name":"gasAllowance","type":"uint256"},{"indexed":false,"name":"amountApplied","type":"uint256"},{"indexed":false,"name":"remainder","type":"uint256"},{"indexed":false,"name":"fromCCTP","type":"bool"}],"name":"Renewed","type":"event"},{"anonymous":false,"inputs":[{"indexed":true,"name":"tokenId","type":"uint256"},{"indexed":false,"name":"label","type":"string"},{"indexed":false,"name":"duration","type":"uint64"},{"indexed":false,"name":"newExpiry","type":"uint64"},{"indexed":false,"name":"paymentToken","type":"address"},{"indexed":true,"name":"referrer","type":"bytes32"},{"indexed":false,"name":"amount","type":"uint256"}],"name":"NameRenewed","type":"event"}]',
          topics,
          `data`
        ) AS `decoded`,
        _gs_op
      FROM all_raw_logs

  wallet_deployed:
    type: sql
    primary_key: event_id
    sql: |
      SELECT
        event_id,
        'namepass' AS event_family,
        'WalletDeployed' AS event_type,
        chain_id,
        block_number,
        block_time,
        tx_hash,
        log_index,
        contract_address,
        decoded.event_params[1] AS label_key,
        lower(decoded.event_params[2]) AS wallet_address,
        decoded.event_params[3] AS label,
        _gs_op
      FROM decoded_logs_v2
      WHERE decoded.event_signature = 'WalletDeployed'
        AND contract_address = '0x2dcb5ca6b21372b43e37c35da8d5d15160423150'

  deposit_processed:
    type: sql
    primary_key: event_id
    sql: |
      SELECT
        event_id,
        'namepass' AS event_family,
        'DepositProcessed' AS event_type,
        chain_id,
        block_number,
        block_time,
        tx_hash,
        log_index,
        contract_address,
        decoded.event_params[1] AS label_key,
        lower(decoded.event_params[2]) AS wallet_address,
        decoded.event_params[3] AS amount,
        decoded.event_params[4] AS remaining_amount,
        _gs_op
      FROM decoded_logs_v2
      WHERE decoded.event_signature = 'DepositProcessed'
        AND contract_address = '0x2dcb5ca6b21372b43e37c35da8d5d15160423150'

  cctp_claimed:
    type: sql
    primary_key: event_id
    sql: |
      SELECT
        event_id,
        'namepass' AS event_family,
        'CCTPClaimed' AS event_type,
        chain_id,
        block_number,
        block_time,
        tx_hash,
        log_index,
        contract_address,
        decoded.event_params[1] AS nonce,
        lower(decoded.event_params[2]) AS wallet_address,
        decoded.event_params[3] AS source_domain,
        decoded.event_params[4] AS burn_amount,
        decoded.event_params[5] AS fee_executed,
        decoded.event_params[6] AS minted_amount,
        _gs_op
      FROM decoded_logs_v2
      WHERE decoded.event_signature = 'CCTPClaimed'
        AND contract_address = '0x39351c9f9eab6093efb4e865a6330ecd2a756f0f'

  renewed:
    type: sql
    primary_key: event_id
    sql: |
      SELECT
        event_id,
        'namepass' AS event_family,
        'Renewed' AS event_type,
        chain_id,
        block_number,
        block_time,
        tx_hash,
        log_index,
        contract_address,
        decoded.event_params[1] AS label_hash,
        lower(decoded.event_params[2]) AS wallet_address,
        lower(decoded.event_params[3]) AS executor_address,
        decoded.event_params[4] AS label,
        decoded.event_params[5] AS duration,
        decoded.event_params[6] AS amount_received,
        decoded.event_params[7] AS gas_allowance,
        decoded.event_params[8] AS amount_applied,
        decoded.event_params[9] AS remainder,
        decoded.event_params[10] AS from_cctp,
        _gs_op
      FROM decoded_logs_v2
      WHERE decoded.event_signature = 'Renewed'
        AND contract_address = '0x39351c9f9eab6093efb4e865a6330ecd2a756f0f'

sinks:
  deposits_webhook:
    type: webhook
    from: incoming_deposits
    url: https://demo-five-gray-37.vercel.app/api/webhooks/goldsky
    secret_name: NAMEPASS_TESTNET_WEBHOOK_AUTH
    one_row_per_request: true

  wallet_deployed_webhook:
    type: webhook
    from: wallet_deployed
    url: https://demo-five-gray-37.vercel.app/api/webhooks/goldsky
    secret_name: NAMEPASS_TESTNET_WEBHOOK_AUTH
    one_row_per_request: true

  deposit_processed_webhook:
    type: webhook
    from: deposit_processed
    url: https://demo-five-gray-37.vercel.app/api/webhooks/goldsky
    secret_name: NAMEPASS_TESTNET_WEBHOOK_AUTH
    one_row_per_request: true

  cctp_claimed_webhook:
    type: webhook
    from: cctp_claimed
    url: https://demo-five-gray-37.vercel.app/api/webhooks/goldsky
    secret_name: NAMEPASS_TESTNET_WEBHOOK_AUTH
    one_row_per_request: true

  renewed_webhook:
    type: webhook
    from: renewed
    url: https://demo-five-gray-37.vercel.app/api/webhooks/goldsky
    secret_name: NAMEPASS_TESTNET_WEBHOOK_AUTH
    one_row_per_request: true
