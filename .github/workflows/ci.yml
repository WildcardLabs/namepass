name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: integration-test
          POSTGRES_DB: namepass_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.7.1

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Foundry test dependency
        run: forge install foundry-rs/forge-std@bf647bd6046f2f7da30d0c2bf435e5c76a780c1b --no-git

      - name: Build the application
        run: npm run build

      - name: Check server and workflow types
        run: npm run check:server

      - name: Test the frontend
        run: npm run test:frontend

      - name: Test the server
        run: npm run test:server
        env:
          TEST_DATABASE_URL: postgresql://postgres:integration-test@127.0.0.1:5432/namepass_test

      - name: Validate the API contract and generated types
        run: npm run check:api

      - name: Test transaction polling and workflow composition
        run: npm run test:transactions

      - name: Test the Workflow runtime
        run: npm run test:workflow

      - name: Check the chain registry
        run: node scripts/check-chains.mjs

      - name: Check the generated Goldsky pipeline
        run: node goldsky/generate-testnet.mjs --check

      - name: Test the contracts
        run: forge test

      - name: Check the helper pricing adapter fingerprint
        run: node scripts/generate-helper-adapter.mjs --check
